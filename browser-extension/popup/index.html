<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码管理系统助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 360px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
        }

        .header {
            background: linear-gradient(135deg, #409eff 0%, #6366f1 100%);
            color: #fff;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-info h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header-info p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .content {
            padding: 16px;
        }

        /* 未登录状态 */
        .login-form {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #606266;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #409eff;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #66b1ff;
        }

        .login-btn:disabled {
            background: #a0cfff;
            cursor: not-allowed;
        }

        .login-btn.loading {
            position: relative;
            color: transparent;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #f56c6c;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* 已登录状态 */
        .logged-in {
            display: none;
        }

        .user-info {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            background: #409eff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .user-details {
            flex: 1;
        }

        .user-details h3 {
            font-size: 15px;
            color: #303133;
        }

        .user-details p {
            font-size: 12px;
            color: #909399;
            margin-top: 2px;
        }

        .logout-btn {
            background: none;
            border: 1px solid #dcdfe6;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #909399;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            color: #f56c6c;
            border-color: #f56c6c;
        }

        /* 当前网站信息 */
        .current-site {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .current-site h3 {
            font-size: 14px;
            color: #303133;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f5f7fa;
            border-radius: 6px;
        }

        .site-icon {
            width: 32px;
            height: 32px;
            background: #e4e7ed;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .site-details {
            flex: 1;
        }

        .site-details .domain {
            font-size: 13px;
            color: #303133;
            font-weight: 500;
        }

        .site-details .status {
            font-size: 11px;
            color: #909399;
            margin-top: 2px;
        }

        .site-details .status.has-credential {
            color: #67c23a;
        }

        /* 凭证列表 */
        .credentials-list {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .credentials-list h3 {
            font-size: 14px;
            color: #303133;
            margin-bottom: 12px;
        }

        .credential-item {
            padding: 12px;
            background: #f5f7fa;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .credential-item:hover {
            background: #ecf5ff;
        }

        .credential-item:last-child {
            margin-bottom: 0;
        }

        .credential-username {
            font-size: 13px;
            color: #303133;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .credential-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fill-btn {
            background: #409eff;
            color: #fff;
        }

        .fill-btn:hover {
            background: #66b1ff;
        }

        .copy-btn {
            background: #67c23a;
            color: #fff;
        }

        .copy-btn:hover {
            background: #85ce61;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #909399;
            font-size: 13px;
        }

        .empty-state svg {
            margin-bottom: 8px;
        }

        /* 快捷操作 */
        .quick-actions {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .quick-actions h3 {
            font-size: 14px;
            color: #303133;
            margin-bottom: 12px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .grid-action {
            padding: 12px;
            background: #f5f7fa;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .grid-action:hover {
            background: #ecf5ff;
            transform: translateY(-2px);
        }

        .grid-action svg {
            margin-bottom: 4px;
        }

        .grid-action span {
            display: block;
            font-size: 12px;
            color: #606266;
        }

        /* 底部链接 */
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 11px;
            color: #909399;
        }

        .footer a {
            color: #409eff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <div class="header-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <div class="header-info">
            <h1>密码管理系统助手</h1>
            <p>快速填充账号密码</p>
        </div>
    </div>

    <div class="content">
        <!-- 登录表单 -->
        <div id="loginForm" class="login-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button id="loginBtn" class="login-btn">登录</button>
            <div id="errorMessage" class="error-message"></div>
        </div>

        <!-- 已登录状态 -->
        <div id="loggedIn" class="logged-in">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div class="user-details">
                    <h3 id="usernameDisplay">Admin</h3>
                    <p>已登录</p>
                </div>
                <button id="logoutBtn" class="logout-btn">退出</button>
            </div>

            <div class="current-site">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    当前网站
                </h3>
                <div class="site-info">
                    <div class="site-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#909399" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                    </div>
                    <div class="site-details">
                        <div class="domain" id="currentDomain">-</div>
                        <div class="status" id="credentialStatus">检测中...</div>
                    </div>
                </div>
            </div>

            <div class="credentials-list">
                <h3>可用账号</h3>
                <div id="credentialsList">
                    <div class="empty-state">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#909399" stroke-width="1.5">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <p>暂无可用账号</p>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <h3>快捷操作</h3>
                <div class="action-grid">
                    <button class="grid-action" id="addCredentialBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        <span>添加账号</span>
                    </button>
                    <button class="grid-action" id="openManagerBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        <span>打开管理</span>
                    </button>
                    <button class="grid-action" id="generatePasswordBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span>生成密码</span>
                    </button>
                    <button class="grid-action" id="settingsBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span>设置</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="#">密码管理系统</a> v1.0.0
    </div>

    <script src="popup.js"></script>
</body>
</html>
