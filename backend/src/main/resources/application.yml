server:
  port: 8880

spring:
  application:
    name: password-manager
  # H2 嵌入式数据库配置（MySQL 兼容模式）
  datasource:
    url: jdbc:h2:file:./data/pwdmgr;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # H2 Web 控制台（仅开发调试用）
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  # SQL 初始化（每次启动执行，IF NOT EXISTS 保证幂等）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
      continue-on-error: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.pwdmgr.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: your-256-bit-secret-key-here-make-it-long-enough
  expiration: 7200000 # 2小时
  refresh-expiration: 604800000 # 7天
  header: Authorization
  prefix: "Bearer "

# 密码加密配置
encryption:
  master-key-length: 32
  iv-length: 16

# 日志配置
logging:
  level:
    com.pwdmgr: debug
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
